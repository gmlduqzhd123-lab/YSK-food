    <meta property="og:type" content="website">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="assets/releases/v2.0.0/css/app.css">
    <link rel="stylesheet" href="assets/releases/v2.0.0/css/print.css">

</head>
<body>

    <!-- 첫 화면: 전국 맛집·학교 단체식사·선수단 식사 시작 화면 -->
    <section class="home" id="home" aria-label="전국 맛집 지도 시작 화면">
        <div class="home-inner">
            <div class="home-top">
                <div class="home-brand"><span class="pin" aria-hidden="true"></span>전국 맛집 지도</div>
                <div class="home-icons">
                    <button type="button" class="home-icon" data-qr aria-label="QR 코드로 접속">📱 QR</button>
                    <button type="button" class="home-icon" data-ys-install aria-label="앱 설치">📲 설치</button>
                </div>
            </div>

            <div class="home-layout">
                <div class="home-map">
                    <!-- 여수·순천·광양 기본 권역 및 전국 확장 일러스트 -->
                    <svg viewBox="0 0 400 300" role="img" aria-label="여수·순천·광양 및 전국 지역 지도">
                        <rect width="400" height="300" fill="#cfe3f7"/>
                        <path d="M0 0 H400 V120 C360 135 330 128 300 140 C280 150 270 170 248 168 C225 166 214 140 192 145 C170 150 165 175 140 172 C112 168 100 140 70 150 C40 160 25 150 0 160 Z" fill="#f4efe4"/>
                        <path d="M150 160 C175 170 185 200 205 215 C220 228 228 255 250 262 C268 268 280 250 276 232 C272 214 252 205 248 185 C245 170 232 168 220 172 C205 177 196 160 180 158 C168 156 158 158 150 160 Z" fill="#f4efe4"/>
                        <path d="M282 238 C295 232 310 240 312 252 C314 266 300 274 288 268 C278 262 274 246 282 238 Z" fill="#f4efe4"/>
                        <path d="M0 40 C80 60 160 30 240 60 C300 80 350 70 400 90" stroke="#e6dccb" stroke-width="2" fill="none"/>
                        <g font-family="inherit" font-size="13" font-weight="700">
                            <g class="city-pin" data-city="순천" role="button" tabindex="0" aria-label="순천 맛집 보기">
                                <circle cx="120" cy="105" r="22" fill="#43a047" opacity="0.18"/><circle cx="120" cy="105" r="9" fill="#43a047" stroke="white" stroke-width="3"/>
                                <rect x="72" y="62" width="96" height="26" rx="13" fill="white"/><text x="120" y="80" text-anchor="middle" fill="#1d2330" data-count-city="순천">순천</text>
                            </g>
                            <g class="city-pin" data-city="광양" role="button" tabindex="0" aria-label="광양 맛집 보기">
                                <circle cx="300" cy="100" r="18" fill="#fb8c00" opacity="0.18"/><circle cx="300" cy="100" r="9" fill="#fb8c00" stroke="white" stroke-width="3"/>
                                <rect x="252" y="57" width="96" height="26" rx="13" fill="white"/><text x="300" y="75" text-anchor="middle" fill="#1d2330" data-count-city="광양">광양</text>
                            </g>
                            <g class="city-pin" data-city="여수" role="button" tabindex="0" aria-label="여수 맛집 보기">
                                <circle cx="232" cy="236" r="24" fill="#1e88e5" opacity="0.18"/><circle cx="232" cy="236" r="9" fill="#1e88e5" stroke="white" stroke-width="3"/>
                                <rect x="120" y="224" width="96" height="26" rx="13" fill="white"/><text x="168" y="242" text-anchor="middle" fill="#1d2330" data-count-city="여수">여수</text>
                            </g>
                        </g>
                    </svg>
                    <button type="button" class="home-live" id="home-live" hidden><i aria-hidden="true"></i><span id="home-live-text"></span></button>
                    <button type="button" class="home-map-open" data-home-open>지도 크게 보기 →</button>
                </div>

                <div>
                    <h1>전국 맛집 탐색과<br><span>학교·선수단 단체식사</span></h1>
                    <p class="home-lead" id="home-lead">전국 맛집 탐색과 학교행사·선수단 단체식사 준비를 한 곳에서.</p>
                    <div class="home-mode-cards" role="group" aria-label="이용 목적별 바로가기">
                        <button type="button" class="home-mode-card" data-home-open data-home-mode="general">🍽️ 일반 맛집 탐색</button>
                        <button type="button" class="home-mode-card" data-home-open data-home-mode="school" data-home-preset="field_trip">🏫 학교 단체식사 준비</button>
                        <button type="button" class="home-mode-card" data-home-open data-home-mode="athlete" data-home-preset="school_sports_club">🏃 선수단 식사 준비</button>
                    </div>
                    <form class="home-search" id="home-search" role="search">
                        <span aria-hidden="true">🔍</span>
                        <input type="search" id="home-search-input" placeholder="식당·메뉴 검색 (예: 꼬막정식, 불고기)" aria-label="맛집 검색" autocomplete="off">
                        <button type="submit">검색</button>
                    </form>
                </div>

                <div>
                    <h2>무엇이 당기세요? <small>종류별 바로가기</small></h2>
                    <div class="home-cats" id="home-cats"></div>
                </div>

                <div>
                    <h2>여수·순천·광양 대표 맛 <small>옆으로 넘겨보기 →</small></h2>
                    <div class="home-picks">
                        <button type="button" class="home-pick" data-query="게장" style="--bg:#e8f0fe; --c:#1e88e5"><span class="art" aria-hidden="true">🦀</span><span class="body"><em>여수</em><strong>돌게장 백반</strong></span></button>
                        <button type="button" class="home-pick" data-query="꼬막" style="--bg:#e6f6ee; --c:#43a047"><span class="art" aria-hidden="true">🐚</span><span class="body"><em>순천</em><strong>꼬막정식</strong></span></button>
                        <button type="button" class="home-pick" data-query="광양불고기" style="--bg:#fdf0e3; --c:#fb8c00"><span class="art" aria-hidden="true">🔥</span><span class="body"><em>광양</em><strong>광양불고기</strong></span></button>
                        <button type="button" class="home-pick" data-query="서대" style="--bg:#e8f0fe; --c:#1e88e5"><span class="art" aria-hidden="true">🐟</span><span class="body"><em>여수</em><strong>서대회 무침</strong></span></button>
                        <button type="button" class="home-pick" data-query="재첩" style="--bg:#fdf0e3; --c:#fb8c00"><span class="art" aria-hidden="true">🥣</span><span class="body"><em>광양</em><strong>재첩국</strong></span></button>
                    </div>
                    <div class="home-cta"><button type="button" data-home-open>🗺️ 맛집 지도 열기</button></div>
                    <p class="home-foot">© 2026 엽쌤. All rights reserved. · <a href="https://gmlduqzhd123-lab.github.io/YScode/">엽쌤의 다른 앱 보기 →</a></p>
                </div>
            </div>
        </div>
    </section>
    <script>
        // 공유 링크(?restaurantId=, ?restaurantIds=, ?place=)나 조건·점검(?check, ?region=, ?mode=, ?q=)으로 들어오면 첫 화면을 건너뛴다
        (function () {
            var q = new URLSearchParams(location.search);
            if (q.has('restaurantId') || q.has('restaurantIds') || q.has('place') || q.has('check') || q.has('region') || q.has('mode') || q.has('q')) {
                var h = document.getElementById('home');
                if (h) h.hidden = true;
            }
        })();
    </script>

    <!-- 대기 서비스 워커 업데이트 안내 배너 (편집 중 탭 강제 새로고침 방지 - AC41) -->
    <div class="sw-banner" id="sw-update-banner" role="status" aria-live="polite" hidden>
        <span>새 앱 버전이 준비되었습니다. 편집 내용을 저장한 뒤 적용할 수 있습니다.</span>
        <button type="button" data-sw-apply>새 버전 적용</button>
    </div>

    <header>
        <h1>전국 맛집 지도 🗺️</h1>
        <div class="head-actions">
            <button type="button" class="head-action-btn" id="open-compare-btn" aria-label="후보 식당 비교함 열기">⚖️ 후보 비교 (0/3)</button>
            <button type="button" class="head-action-btn" id="open-events-btn" aria-label="내 행사 계획 열기">📅 내 행사 (0)</button>
            <button type="button" class="head-action-btn" id="open-report-btn" aria-label="이용 기록 및 식당 제보">✍️ 기록·제보</button>
            <button type="button" class="head-action-btn" id="open-op-tool-btn" aria-label="운영자 데이터 점검 및 병합">🛠️ 자료점검</button>
            <span class="install-btn head-install"><button type="button" aria-label="앱 설치">📲 앱 설치</button></span>
            <button type="button" class="head-qr" data-qr aria-label="공개 QR 코드 보기">📱 QR</button>
        </div>
    </header>

    <!-- 지역 자료 상태 안내 배너 (갱신일·좌표 미확인 수·이전 버전 대체 안내) -->
    <div class="status-banner info" id="dataset-status-banner" role="status" aria-live="polite" hidden></div>

    <!-- 이용 모드 전환 및 행사 프리셋·기준점 선택 바 (FR01, FR02, FR04) -->
    <div class="mode-bar" role="region" aria-label="이용 모드 및 행사 프리셋">
        <div class="mode-tabs" role="group" aria-label="이용 모드 선택">
            <button type="button" class="mode-tab active" data-mode="general" aria-pressed="true">🍽️ 일반 맛집</button>
            <button type="button" class="mode-tab" data-mode="school" aria-pressed="false">🏫 학교 단체식사</button>
            <button type="button" class="mode-tab" data-mode="athlete" aria-pressed="false">🏃 선수단 식사</button>
        </div>
        <div class="mode-Selectors">
            <select id="event-preset-select" class="mode-select" aria-label="행사 프리셋 선택">
                <option value="">🎯 행사 프리셋 선택 (기본 안내)</option>
                <option value="field_trip">현장체험학습 (1일)</option>
                <option value="school_trip">수학여행 (다일)</option>
                <option value="training_camp">수련활동</option>
                <option value="school_sports_club">학교스포츠클럽 대회</option>
                <option value="national_youth_sports">전국소년체육대회</option>
                <option value="national_sports_festival">전국체육대회</option>
            </select>
            <select id="ref-point-select" class="mode-select" aria-label="기준점(체험처·경기장·숙소) 선택">
                <option value="">📍 기준점 선택 (체험처·경기장·숙소)</option>
            </select>
        </div>
        <div class="preset-guide-note" id="preset-guide-note" hidden></div>
    </div>

    <!-- 단체 조건 입력 바 (학교·선수단 모드 시 표시 - FR03) -->
    <div class="group-criteria-bar" id="group-criteria-bar" role="region" aria-label="단체 식사 조건 필터" hidden>
        <div class="gc-grid">
            <label class="gc-field">학생·선수 <input type="number" id="gc-students" min="0" max="2000" placeholder="명"></label>
            <label class="gc-field">인솔·지도자 <input type="number" id="gc-staff" min="0" max="500" placeholder="명"></label>
            <label class="gc-field budget">1인 예산(원) <input type="number" id="gc-budget" min="0" step="1000" placeholder="예: 12000"></label>
            <label class="gc-field">버스(대) <input type="number" id="gc-buses" min="0" max="50" placeholder="대"></label>
            <label class="gc-field">좌석방식
                <select id="gc-seating-policy">
                    <option value="simultaneous_required">동시 착석 필수</option>
                    <option value="split_waves_allowed">시간차(교대) 허용</option>
                </select>
            </label>
            <label class="gc-field">방문일 <input type="date" id="gc-visit-date"></label>
            <label class="gc-field">시작 <input type="time" id="gc-start-time"></label>
            <label class="gc-field">종료 <input type="time" id="gc-end-time"></label>
            <label class="gc-check"><input type="checkbox" id="gc-bus-parking"> 대형버스 주차 필수</label>
            <label class="gc-check"><input type="checkbox" id="gc-early-breakfast"> 이른 아침식사 필수</label>
            <label class="gc-check"><input type="checkbox" id="gc-lunchbox"> 도시락·포장 필수</label>
            <button type="button" class="gc-reset-btn" id="gc-reset-btn">조건 초기화</button>
        </div>
    </div>

    <!-- 전국 지역 드롭다운 + 검색창 -->
    <div class="search-box">
        <select id="region-select" class="mode-select" aria-label="전국 지역 선택">
            <option value="all">여수·순천·광양 전체</option>
        </select>
        <input type="search" id="search" placeholder="식당 이름·메뉴·주소 검색 (예: 국밥, 게장)" aria-label="맛집 검색" autocomplete="off">
    </div>

    <!-- 빠른 지역 버튼 + 즐겨찾기/영업중 + 종류 필터 -->
    <div class="filter-container">
        <div class="filter-group" role="group" aria-label="빠른 지역 선택">
            <button type="button" class="filter-btn active" data-region="all" aria-pressed="true">여순광 전체</button>
            <button type="button" class="filter-btn" data-region="jn-yeosu" aria-pressed="false">🌊 여수</button>
            <button type="button" class="filter-btn" data-region="jn-suncheon" aria-pressed="false">🌿 순천</button>
            <button type="button" class="filter-btn" data-region="jn-gwangyang" aria-pressed="false">☀️ 광양</button>
        </div>
        <span class="filter-divider" aria-hidden="true"></span>
        <div class="filter-group" role="group" aria-label="추가 조건">
            <button type="button" class="filter-btn toggle" id="fav-filter" aria-pressed="false">⭐ 즐겨찾기</button>
            <button type="button" class="filter-btn toggle" id="open-filter" aria-pressed="false">🕒 지금 영업 중</button>
        </div>
        <span class="filter-divider" aria-hidden="true"></span>
        <div class="filter-group" id="category-group" role="group" aria-label="종류 선택"></div>
    </div>

    <main>
        <section class="panel" id="panel" aria-label="맛집 및 단체식사 후보 목록">
            <div class="panel-head">
                <span><span id="panel-count">맛집 불러오는 중…</span><span class="sort-note" id="sort-note"></span></span>
                <div class="view-switch" role="group" aria-label="화면 보기">
                    <button type="button" data-mode="map" aria-pressed="false">🗺️ 지도</button>
                    <button type="button" data-mode="half" aria-pressed="true">반반</button>
                    <button type="button" data-mode="list" aria-pressed="false">📋 목록</button>
                </div>
            </div>
            <ul class="place-list" id="place-list"></ul>
        </section>

        <div class="map-wrap">
            <div id="map"></div>
            <div class="legend" id="legend" aria-hidden="true"></div>
            <button type="button" class="locate-btn" id="locate-btn">📍 내 주변</button>
            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
    </main>

    <footer class="site-footer">
        © 2026 엽쌤. All rights reserved. · <a href="https://gmlduqzhd123-lab.github.io/YScode/" style="color:inherit;text-decoration:underline;text-underline-offset:3px">엽쌤의 다른 앱 보기 →</a><span class="install-btn"> · <button type="button">📲 앱 설치</button></span><span class="qr-btn"> · <button type="button" data-qr>📱 QR로 접속</button></span>
    </footer>

    <!-- 정적 ES 모듈 진입점 (카카오 지도 SDK는 map.js에서 비차단 방식으로 로드하여 목록·검색·행사 기능을 차단하지 않음) -->
    <script type="module" src="assets/releases/v2.0.0/js/app.js"></script>
</body>
</html>
