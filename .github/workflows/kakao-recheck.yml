# 매달 카카오맵에서 모든 식당의 장소 페이지가 남아 있는지(폐업·삭제 여부) 다시 확인하고,
# 바뀐 점이 있으면 자료를 다시 만들어 PR을 연다. (병합은 사람이 확인 후 진행)
name: 카카오맵 정기 재확인

on:
  schedule:
    # 매달 2일 03:17 (한국 시간) = 1일 18:17 UTC
    - cron: '17 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kakao-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # 빌드 도구가 예전 커밋(95f28ea)의 기본 목록을 읽으므로 전체 기록을 받는다
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 카카오맵 재확인
        run: node tools/kakao-recheck.mjs --out tools/kakao-recheck-latest.json --summary "$RUNNER_TEMP/summary.md"

      - name: 자료 다시 만들기·검증·테스트
        run: |
          node tools/build-dataset.mjs
          node tools/validate-dataset.mjs
          node --test tests/*.test.mjs

      - name: 바뀐 점이 있으면 PR 열기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet; then
            echo "바뀐 점이 없습니다."
            exit 0
          fi
          # 실행마다 새 브랜치를 쓴다 (예전 브랜치를 강제로 덮으면 그 사이 바뀐 워크플로 파일까지
          # 고치는 것으로 처리되어 GITHUB_TOKEN 권한으로는 거절된다)
          BRANCH="auto/kakao-recheck-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "카카오맵 정기 재확인 $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          # 아직 병합하지 않은 예전 재확인 PR은 새 결과로 대체한다
          for n in $(gh pr list --state open --json number,headRefName \
              -q '.[] | select(.headRefName | startswith("auto/kakao-recheck-")) | .number'); do
            gh pr close "$n" --delete-branch --comment "새 정기 재확인 결과(${BRANCH})로 대체합니다."
          done
          printf '\n---\n이 실행([로그](%s/%s/actions/runs/%s))에서 자료 다시 만들기·검증·테스트를 모두 통과했습니다.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/summary.md"
          gh pr create --base main --head "$BRANCH" \
            --title "카카오맵 정기 재확인 $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/summary.md"
