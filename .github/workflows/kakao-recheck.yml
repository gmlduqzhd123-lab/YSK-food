# 매달 카카오맵에서 모든 식당의 장소 페이지가 남아 있는지(폐업·삭제 여부) 다시 확인하고,
# 바뀐 점이 있으면 자료를 다시 만들어 PR을 연다. (병합은 사람이 확인 후 진행)
name: 카카오맵 정기 재확인

on:
  schedule:
    # 매달 2일 03:17 (한국 시간) = 1일 18:17 UTC
    - cron: '17 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kakao-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # 빌드 도구가 예전 커밋(95f28ea)의 기본 목록을 읽으므로 전체 기록을 받는다
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 카카오맵 재확인
        run: node tools/kakao-recheck.mjs --out tools/kakao-recheck-latest.json --summary "$RUNNER_TEMP/summary.md"

      - name: 자료 다시 만들기·검증·테스트
        run: |
          node tools/build-dataset.mjs
          node tools/validate-dataset.mjs
          node --test tests/*.test.mjs

      - name: 바뀐 점이 있으면 PR 열기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet; then
            echo "바뀐 점이 없습니다."
            exit 0
          fi
          BRANCH="auto/kakao-recheck-$(date -u +%Y%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "카카오맵 정기 재확인 $(date -u +%Y-%m)"
          git push -f origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title "카카오맵 정기 재확인 $(date -u +%Y-%m)" \
              --body-file "$RUNNER_TEMP/summary.md"
          fi
